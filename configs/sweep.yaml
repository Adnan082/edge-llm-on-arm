# Sweep definition (CLAUDE.md §5, §7). Read by bench/run_sweep.py and roofline.py.
# TBD = not decided or not yet measured; fill in from the machine, never guess.

models:
  small:
    hf_repo: Qwen/Qwen3-0.6B
    hf_revision: c1899de289a04d12100db370d81485cdf75e47ca   # Hub API, 2026-11-01
    f16_file: small_F16.gguf   # results/models/small_F16.json
    f16_sha256: 2768730ec3757a58e06b95a05c9bc731edae2288a3ac3a4573e59dd0dbd66036
  large:
    hf_repo: Qwen/Qwen3-1.7B
    hf_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e   # Hub API, 2026-11-01
    f16_file: large_F16.gguf   # results/models/large_F16.json
    f16_sha256: cbe12cc9edb49714def6ccaa32a935b3d968e2d7bfeedd158dada0b80fd58942

# Final (ADR-012). Files are work/models/<alias>_<quant>.gguf.
quants: [F16, Q8_0, Q4_0, Q4_K_M]

builds: [baseline, kleidiai]
threads: [1, 2, 4, 8]
prefill_prompt_lengths: [128, 512, 2048]
decode_tokens: 128   # llama-bench tg128, from an empty context
batch: 1
repetitions: 5
slow_repetitions: 3   # for the points in slow_points (CLAUDE.md §7.4)

# ADR-018: decode is also measured after a context of this many tokens, at these thread counts
# only. llama-bench fills the context before the timer starts (Day 3 source reading).
decode_depth: 2048
decode_depth_threads: [1, 8]

# ADR-019: llama-bench's own defaults at the pinned commit, written out on every command line so a
# different llama-bench build, or `auto`, cannot change them silently. Day 3 source reading
# (tools/llama-bench/llama-bench.cpp:387-423, src/llama-context.cpp:660, ggml-cpu.cpp:400):
#   flash_attn: `auto` resolves to enabled on the CPU backend (the CPU supports FLASH_ATTN_EXT)
#   load_mode:  `auto` resolves to mmap on the CPU backend (mmap_support = true); kept as `auto`,
#               the default, and the load log's `load_mode = mmap` line is stored in every record
#   warm-up:    one unmeasured run per test, on by default; we never pass --no-warmup
bench_settings:
  n_batch: 2048
  n_ubatch: 512
  type_k: f16
  type_v: f16
  flash_attn: 1
  load_mode: auto
  repack: 1
  poll: 50
  prio: 0
  delay: 0

# Points run with slow_repetitions instead of repetitions. Each: {point: <pair_id>, reason}.
# Chosen before any full-sweep result exists (CLAUDE.md §7 item 10). Day 3 pilot: the slowest
# full-sweep point, timed to bound the sweep's wall time; revisit after reading the estimate.
slow_points:
  - {point: large_F16_t1_pp2048, reason: "slowest full-sweep point (large model, F16, 1 thread, 2048-token prompt)"}
pruned_points: []    # {point, reason}; only before any full-sweep results exist (§7 item 10)

# Day 3 pilot (CLAUDE.md §10): small model, F16 and Q4_0, both builds, t in {1, 8}, plus the
# slowest full-sweep point to time the worst case.
pilot:
  models: [small]
  quants: [F16, Q4_0]
  threads: [1, 8]
  tests: [pp512, tg128, tg128d2048]
  extra_points:
    - {model: large, quant: F16, threads: 1, test: pp2048}
